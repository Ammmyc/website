overview: |
  Our portfolio of projects spans community wellbeing, healthcare innovation, social rehabilitation, AI and emotional health, and youth mental health research, reflecting a commitment to resilience and compassionate care across diverse populations. Initiatives such as Project Soothe HK — Young Ambassador Program and 24 Flavours of Positive Thinking empower youth and families to cultivate optimism, while compassion-focused interventions support ethnic minority elders and pilot studies evaluate end-of-life care models for younger patients. Research into employment experiences explores their impact on drug abuse and rehabilitation, and AI-focused projects investigate emotional dependency, self-disclosure, self-compassion, and loneliness. Finally, a cross-cultural study of depression in high-ability adolescents connects collaborators in Hong Kong, Taiwan, the Netherlands, and the UK, highlighting global perspectives on adolescent mental health. Together, these projects demonstrate an integrated effort to advance knowledge, strengthen communities, and address pressing challenges at the intersection of psychology, health, and technology.